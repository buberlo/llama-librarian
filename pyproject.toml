[project]
name = "llama-librarian"
version = "0.1.0"
description = "A local-first note contradiction manager with whimsical librarian mechanics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=5.0,<6.0",
]
local-embeddings = [
    "sentence-transformers>=2.6",
]

[project.scripts]
llama-librarian = "app.main:run"
llama-librarian-seed = "scripts.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "scripts",
    "tests",
    "data",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"